<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Планнер ГИПа</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e79">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1d2733;--mut:#6b7785;--pri:#1f4e79;--red:#c0392b;--org:#d9822b;--grn:#2e8b57;--bd:#dde3ea}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1e252d;--tx:#e6ebf0;--mut:#93a0ae;--pri:#5b9bd5;--bd:#2d3742}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
main{max-width:900px;margin:0 auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);z-index:5}
nav button{flex:1 0 auto;min-width:60px;border:0;background:none;color:var(--mut);padding:8px 2px;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card.done .t{text-decoration:line-through;color:var(--mut)}
.card input[type=checkbox]{width:22px;height:22px;flex:none}
.grow{flex:1;min-width:0;cursor:pointer}
.t{font-weight:600;word-break:break-word}
.s{font-size:12.5px;color:var(--mut);margin-top:2px}
.b{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);margin-right:4px;font-size:12px}
.b.red{background:var(--red);color:#fff;border-color:var(--red)}
.b.orange{background:var(--org);color:#fff;border-color:var(--org)}
.sum{display:flex;gap:8px;margin:8px 0}
.sum div,.sum button{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center;color:var(--tx);font:inherit;cursor:pointer}
.sum b{display:block;font-size:22px}
.sum .r b{color:var(--red)}
h2{font-size:16px;margin:16px 0 4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button,.btn,select,input,textarea{font:inherit;color:var(--tx)}
button,.btn{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-block}
button.pri,.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.dng{color:var(--red)}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}
label.f{display:block;margin:8px 0 2px;font-size:12.5px;color:var(--mut)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.warn{background:#fff3cd;color:#664d03;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13.5px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
pre#prev{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;font:14px/1.5 Georgia,serif}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);width:min(560px,94vw);max-height:90vh;padding:16px}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 6px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90vw}
#toast.on{opacity:1}
table.pv{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
table.pv td,table.pv th{border:1px solid var(--bd);padding:3px 5px;text-align:left;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.blk{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:10px;padding:8px 10px;margin:8px 0}
.blk.cur{border-left-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.blk .tm{font-size:12px;color:var(--mut);width:42px;flex:none;text-align:center;line-height:1.5}
.blk .bn{font-size:12.5px;color:var(--mut)}
.blk .bt{margin:4px 0;font-weight:600}
.blk .card{margin:6px 0 2px}
.cr{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd);font-size:14px}
.cr input{width:20px;height:20px;flex:none}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.qa input[type=text]{margin-bottom:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:520px){.g3{grid-template-columns:1fr}}
.warn button{margin-left:6px;padding:3px 10px}
details summary{cursor:pointer;color:var(--mut);margin:8px 0}
.warn.al{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.dc{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.dc.hi{border-left-color:var(--red);background:color-mix(in srgb,var(--red) 9%,var(--card))}
.dc.md{border-left-color:var(--org);background:color-mix(in srgb,var(--org) 9%,var(--card))}
.dc input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.dc .t{font-size:16px;font-weight:600}
.dc .cm{font-size:13.5px;margin-top:2px}.dc.hi .cm{color:var(--red);font-weight:600}.dc.md .cm{color:#a85d14}
.dc .mt{font-size:12.5px;color:var(--mut);margin-top:3px}.dc .mt .r{color:var(--red);font-weight:600}
.dc .ac{display:flex;flex-direction:column;gap:6px;flex:none}.dc .ac button{padding:4px 9px;font-size:13px}
.dc.done .t{text-decoration:line-through;opacity:.6}
.crit{background:var(--card);border:1px solid var(--red);border-left:4px solid var(--red);border-radius:10px;padding:8px 10px;margin:8px 0}
.lr{font-size:12.5px;color:var(--mut);margin:0 0 6px 8px}
.lr button{padding:2px 8px;margin-left:6px}
</style>
</head>
<body>
<header><h1>Планнер ГИПа</h1><div id="syst" style="font-size:11px;opacity:.85;margin-top:2px"></div></header>
<div id="alerts" style="max-width:900px;margin:0 auto;padding:0 12px"></div>
<main id="view"></main>
<nav id="tabs" style="overflow-x:auto">
  <button data-tab="today"><b>📅</b>Сегодня</button>
  <button data-tab="plan"><b>🗂</b>План</button>
  <button data-tab="docs"><b>✉</b>Документы</button>
  <button data-tab="setup"><b>⚙</b>Настройки</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast"></div>

function kbAnswer(id,v,b){

    if(v==='skip'){t.due=nextPat(t,late?t0:addDays(t0,1));t.skip=(t.skip||0)+1;if(t.due>t0)t.hold=t.due;toast('Пропущено. Следующий раз '+fmt(t.due));}
    else{t.due=late?t0:(isHome(t)?addDays(t0,1):nextWorkday(t0));t.moved=t0;delete t.hold;if(t.due>t0)t.hold=t.due;toast('Перенесено на '+fmt(t.due));}
    t.status='todo';t.spent=0;delete t.pct;K.ans[id]=Date.now();}
  else if(kind==='rkd'){const t=S.tasks.find(x=>x.id===rest);if(!t||!t.cp)return true;const c=t.cp;
    if(v==='wait'){c.rkdAsk=fwdWd(fwdWd(fwdWd(t0,1),1),1);toast('Напомню о РКД '+fmt(c.rkdAsk));return true;}
    if(v==='yes'||v==='part'){if(v==='yes'){c.rkdSt='got';if(t.status==='wait'){t.status='todo';delete t.wait;}if(t.needsData==='РКД')t.needsData='';}
      if(!c.grafId){c.grafId=cpMk(t,'graf','Запросить график: '+t.cp.num+' '+cpShort(t),'graf',{'документ':cpShort(t),'срок':fmt(t.start)},'График запрашивается после получения РКД.','График',fwdWd(t0,2)).id;}}
    if(v==='no'||v==='part'){c.reqId=cpMk(t,'rkdreq','Запросить сроки предоставления РКД: '+c.num+' '+cpShort(t),'rkd',{'документ':'РКД на оборудование к этапу «'+cpShort(t)+'»','срок':fmt(t.start)},'РКД не предоставлено: запросить сроки. Этап ждёт исходные данные.','Письмо',fwdWd(t0,2)).id;

  else if(kind==='why'){const t=S.tasks.find(x=>x.id===rest);if(!t)return true;const k=SMALL(lt(t))?{}:(K.types[lt(t)]=K.types[lt(t)]||{});

    else if(v==='drop'){if(confirm('Удалить задачу «'+t.title.slice(0,40)+'»?'))S.tasks=S.tasks.filter(x=>x.id!==t.id);}
    K.why.push({ty:lt(t),r:v,ts:Date.now()});if(K.why.length>200)K.why.shift();K.ans[id]=Date.now();}

/* ---------- рекомендация задержаться после работы: только при реальной угрозе критичному, с лимитами ---------- */
const otCfg=()=>({max:S.settings.otMax!=null?+S.settings.otMax:2,week:S.settings.otWeek!=null?+S.settings.otWeek:2});
const otUsed=()=>{let n=0;for(let i=0;i<7;i++){const L=S.log[addDays(today(),-i)];if(L&&L.ot>0)n++;}return n;};
const mustToday=t=>isOpen(t)&&!isHome(t)&&t.due&&diff(t.due,today())<=0&&rem(t)>0.01&&(isCrit(t)||(+t.imp)===3)&&!(t.wait&&diff(today(),t.wait)<3);
function getBlocks(opt){
  const b=parseBlocks(S.settings.blocks),L=dayLog();
  if(!(opt&&opt.noOt)&&+L.ot>0){const end=Math.max(0,...b.map(x=>x.to)),ty=[];S.tasks.forEach(t=>{if(mustToday(t)&&t.type&&!ty.includes(t.type))ty.push(t.type);});
    b.push({from:end,to:end+Math.round(L.ot*60),name:'Сверх основного дня',types:ty,fixed:'',calls:false,meet:false,fallback:''});}
  return b;}
function overtimeAdvice(){
  const c=otCfg(),t0=today(),dow=new Date().getDay();if(dow<1||dow>5||c.week<=0||c.max<=0)return null;
  const L=dayLog();if(L.otNo)return null;
  if(+L.ot>0)return {accepted:true,hours:+L.ot};
  const P=planBlocks({noOt:true,noReserve:true}),must=P.rest.filter(mustToday),need=must.reduce((x,t)=>x+rem(t),0);
  let extra=need;
  if(extra<=0.01){const rz=redZone().filter(x=>diff(x.t.due,t0)<=2);if(rz.length)extra=rz.reduce((m,x)=>Math.max(m,x.cum-x.avail),0);}
  if(!(extra>0.01))return null;
  extra=Math.ceil(extra*2)/2;const hours=Math.min(extra,c.max),end=Math.max(0,...parseBlocks(S.settings.blocks).map(b=>b.to)),used=otUsed();
  return {hours,extra,short:Math.max(0,extra-hours),until:hm(end+Math.round(hours*60)),tasks:(must.length?must:redZone().map(x=>x.t)).slice(0,4),blocked:used>=c.week,used,limit:c.week};}
function otView(){
  const a=overtimeAdvice();if(!a)return '';
  if(a.accepted)return `<div class="warn">🌙 Сегодня вы остаётесь на ${a.hours} ч после основного дня: в плане добавлен блок «Сверх основного дня».</div>`;
  const names=a.tasks.map(t=>'«'+esc(t.title)+'»').join(', '),cons=a.tasks.map(consOf).filter(Boolean)[0];
  const alt=`<button data-act="otshift" data-id="${a.tasks[0].id}">✉ Уведомление о переносе срока</button>`;
  if(a.blocked)return `<div class="warn" style="border-color:#c0392b"><b>🌙 Критичное не помещается в рабочий день</b><div class="s">Нужно ещё около ${a.extra} ч: ${names}. Вы уже задерживались ${a.used} раз за неделю (лимит ${a.limit}). Лучше решить иначе: договориться о переносе срока, попросить помощь или убрать менее важное.${cons?' Последствие срыва: '+esc(cons)+'.':''}</div><div class="bar">${alt}<button data-act="otyes" data-h="${Math.min(a.extra,otCfg().max)}">Всё равно остаюсь</button><button data-act="otno">Не сегодня</button></div></div>`;
  return `<div class="warn" style="border-color:#c0392b"><b>🌙 Рекомендую остаться после работы на ${a.hours} ч (до ${a.until})</b><div class="s">Иначе не успеть критичное: ${names}.${cons?' Последствие срыва: '+esc(cons)+'.':''}${a.short?` Даже с этим не хватит ещё ${a.short} ч: предупредите о возможном переносе.`:''} Задержка — разовая мера: ${a.used} из ${a.limit} разрешённых на этой неделе.</div><div class="bar"><button data-act="otyes" data-h="${a.hours}">Остаюсь на ${a.hours} ч</button>${alt}<button data-act="otno">Не сегодня</button></div></div>`;}

/* ---------- риски, объяснение приоритета, перегрузка и варианты решения (ТЗ 2.3–2.5, 3.4) ---------- */
function nextWorkday(d){let x=addDays(d,1);while([0,6].includes(dt(x).getDay()))x=addDays(x,1);return x;}
function workdaysBetweenC(a,b){if(b<a)return 0;if(diff(b,a)>400)b=addDays(a,400);return workdaysBetween(a,b);}
function riskMap(){
  if(RM)return RM;RM={};const t0=today(),H=(+S.settings.hours||7)*0.8;let cum=0;
  S.tasks.filter(t=>isOpen(t)&&isWork(t)&&!isHome(t)&&t.due&&rem(t)>0.01).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0).forEach(t=>{
    cum+=rem(t);const avail=H*Math.max(1,workdaysBetweenC(t0,t.due>t0?t.due:t0));RM[t.id]={cum,avail,slack:avail-cum,need:rem(t)};});
  return RM;}
function riskOf(t){
  const t0=today();if(isClosed(t)||!isWork(t))return {lvl:0,text:''};
  if(!t.due)return {lvl:0,text:'срок не задан: риск не оценивается'};
  const d=diff(t.due,t0);
  if(unavail(t)&&d<=3){const bb=blockedBy(t);return {lvl:3,text:d<0?`просрочено на ${-d} дн., работа не может быть выполнена: `+(bb.length?'ждёт «'+bb[0].title.slice(0,30)+'»':'нет исходных данных'):`срок через ${d} дн., а работа ${bb.length?'ждёт «'+bb[0].title.slice(0,30)+'»':'ждёт исходных данных'}`};}
  if(d<0)return {lvl:3,text:`просрочено на ${-d} дн.`};
  const r=riskMap()[t.id];if(!r)return {lvl:1,text:'работы не осталось'};
  if(r.slack<0)return {lvl:3,text:`с учётом всех более ранних сроков не хватает ${(-r.slack).toFixed(1)} ч до срока (нужно ${r.cum.toFixed(1)} ч, есть ${r.avail.toFixed(1)} ч)`};
  if(r.slack<r.need*0.5||r.slack<1)return {lvl:2,text:`запас до срока мал: ${r.slack.toFixed(1)} ч (всего доступно ${r.avail.toFixed(1)} ч с учётом резерва)`};
  return {lvl:1,text:`запас ${r.slack.toFixed(1)} ч, риск низкий`};}
function postponeText(t){
  const t0=today(),H=(+S.settings.hours||7)*0.8;
  if(!t.due)return 'срока нет: перенос ничего не нарушит, но задача продолжит копиться';
  const d=diff(t.due,t0);if(d<0)return `уже просрочена на ${-d} дн.; перенос увеличит просрочку`;
  const nw=nextWorkday(t0),days=workdaysBetweenC(nw,t.due);
  if(d===0||days<=0)return 'срок сегодня: перенос на завтра приведёт к просрочке';
  const slack=H*days-rem(t);
  return slack<0?`после переноса на следующий рабочий день срок станет невыполнимым (не хватит ${(-slack).toFixed(1)} ч)`:`после переноса запас до срока ${slack.toFixed(1)} ч (без учёта других задач)`+(isCrit(t)?'; задача критичная, переносить не рекомендуется':'');}
function explainTask(t,rank,total){
  const t0=today(),L=[],P=scoreParts(t),k=lk(t,+t.est>0?+t.est:1);
  if(t.due){const d=diff(t.due,t0);L.push(['Срочность',d<0?`просрочено на ${-d} дн.`:d===0?'срок сегодня':`до ${fmt(t.due)}, осталось ${workdaysBetweenC(t0,t.due)} раб. дн.`+(t.dueAuto?`; внутренний срок по правилу (${t.dueAuto}), срок плана ${t.due0?fmt(t.due0):'не задан'}`:'')]);}else L.push(['Срочность','срок не задан']);
  L.push(['Важность',['','низкая','обычная','высокая'][+t.imp||2]+(stakeOf(t)?`; вес последствий ${stakeOf(t)} из 3`:'')+' (важность отделена от срочности: срочная мелочь не обязана быть выше важной работы)']);
  if(consOf(t))L.push(['Последствия невыполнения',consOf(t)]);
  const dp=dependents(t);if(dp.length)L.push(['Влияние на другие работы',`от результата зависят ${inflCount(t)}: `+dp.slice(0,3).map(x=>'«'+x.title.slice(0,30)+'»').join(', ')+(dp.some(x=>entOf(x)==='milestone')?' (в том числе контрольная точка)':'')]);
  const pr=blockedBy(t);if(pr.length)L.push(['Зависимости','сначала нужно выполнить: '+pr.slice(0,3).map(x=>'«'+x.title.slice(0,30)+'»').join(', ')]);
  if(t.status==='wait'||t.needsData)L.push(['Возможность выполнения',(t.status==='wait'?'ожидает данных':'нужны исходные данные')+(t.needsData?': '+t.needsData:'')]);
  L.push(['Трудоёмкость',`осталось ${rem(t)} ч`+(k!==1?`; оценка ${t.est} ч скорректирована ×${k} по вашей истории`:'')]);
  const rk=riskOf(t);if(rk.text)L.push(['Риск задержки',(['','низкий','средний','высокий'][rk.lvl]||'')+': '+rk.text]);
  L.push(['Цена переноса',postponeText(t)]);
  if(t.deleg)L.push(['Делегирование','можно передать: '+t.deleg]);
  const adj=ladj(t);if(adj)L.push(['Ваши привычки',(adj>0?'поднята':'опущена')+' на '+Math.abs(adj)+' б. по истории ваших выборов (можно отключить в «Статистика и обучение»)']);
  const sum=`Баллы приоритета: важность ${Math.round(P.imp)}, срочность ${Math.round(P.urg)}, последствия ${Math.round(P.cons)}, влияние на другие ${Math.round(P.infl)}${P.doing?', в работе '+P.doing:''}${adj?', привычки '+(adj>0?'+':'')+adj:''}.`;
  return {L,sum,rank,total};}

/* список дня: kind='work' | 'home'; в план попадает то, что помещается в доступные часы (срок «сегодня» — всегда) */
function planDay(kind){
  const t0=today(),home=kind==='home';
  const cap=home?(+S.settings.homeHours||1):(+S.settings.hours||6);
  const open=S.tasks.filter(t=>isOpen(t)&&isHome(t)===home&&isWork(t)&&!unavail(t));
  const cand=[],later=[];

/* расписание дня по блокам (логика листа «Лист1»): в каждый блок — самая срочная задача из разрешённых типов, без повторов */

/* расписание по блокам: учитывает остаток времени сегодня, длинные задачи (часть часов в блок), потерянное время и звонки */
function reserveFrac(){const v=S.settings.resv;if(v!==undefined&&v!==''&&v!==null&&!isNaN(+v))return Math.max(0,Math.min(.5,+v/100));
  const ds=Object.keys(S.log).sort().slice(-11,-1).map(k=>S.log[k]).filter(l=>l.plan0);if(ds.length<3)return .1;
  return Math.max(.05,Math.min(.35,lmean(ds.map(l=>l.lost||0))/420));}
function planBlocks(opt){
  opt=opt||{};
  const t0=today(),nm=opt.now!=null?opt.now:nowMin(),lost=opt.lost!=null?opt.lost:(dayLog().lost||0);
  const timed=S.tasks.filter(t=>isOpen(t)&&!isHome(t)&&entOf(t)==='task'&&tmOk(t)&&tmDay(t)===t0&&!unavail(t)&&rem(t)>0.01),timedIds=new Set(timed.map(t=>t.id));
  const work=S.tasks.filter(t=>isOpen(t)&&isWork(t)&&!unavail(t)&&!isHome(t)&&!notYet(t,t0)&&rem(t)>0.01&&!timedIds.has(t.id));
  const meet=meetDays().includes(dt(t0).getDay());
  const meets=S.tasks.filter(t=>isOpen(t)&&entOf(t)==='meeting'&&t.mt&&(t.due===t0||(t.dly&&dlyOn(t,t0)&&diff(t0,t.due)>0))).map(t=>{const m=(t.due===t0?t.mt:(t.mt0||t.mt)).match(/(\d+):(\d+)-(\d+):(\d+)/);return m?{from:+m[1]*60+ +m[2],to:+m[3]*60+ +m[4],title:t.title}:null;}).filter(Boolean);
  timed.forEach(t=>{const f=tmMin(t);meets.push({from:f,to:f+Math.max(15,Math.round(rem(t)*60)),title:t.title});});
  const isCall=t=>(t.type||'').toLowerCase()==='звонок';
  const sc={},od=new Set(),left={},dcap={};
  work.forEach(t=>{sc[t.id]=score(t);if(t.due&&diff(t.due,t0)<=0)od.add(t.id);left[t.id]=rem(t);dcap[t.id]=+t.perDay>0?+t.perDay:Infinity;});
  const calls=work.filter(isCall).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||sc[b.id]-sc[a.id]);
  const IM=iqModel();const usedCalls=new Set(); // потерянное время уже учтено: план всегда считается от текущей минуты
  const rows=getBlocks(opt).map((b,i)=>{
    const r={b,i,items:[],calls:[],text:'',cur:nm>=b.from&&nm<b.to,past:b.to<=nm,cap:0};
    if(b.fixed){r.text=b.fixed;return r;}
    if(b.meet&&meet){r.text='Оперативное совещание';return r;}
    if(r.past)return r;
    let cap=(b.to-Math.max(b.from,nm))/60;
    const bm=meets.filter(m=>m.to>Math.max(b.from,nm)&&m.from<b.to);let ov=0;bm.forEach(m=>{ov+=Math.min(b.to,m.to)-Math.max(b.from,nm,m.from);});if(bm.length){r.busy=bm.map(m=>hm(m.from)+' '+m.title);cap=Math.max(0,cap-ov/60);}
    const rf=opt.noReserve?0:blockReserve(b,IM,t0);cap=Math.round(cap*(1-rf)*100)/100;r.cap=cap;let cur=Math.max(b.from,nm);

      cc.forEach(c=>{usedCalls.add(c.id);cap=Math.round((cap-0.1)*100)/100;cur+=6;});r.calls=cc;

      if(cand.length)cand.sort((a,c)=>(od.has(a.id)?0:1)-(od.has(c.id)?0:1)||rank(a)-rank(c)||sc[c.id]-sc[a.id]);
      else cand=work.filter(t=>!isCall(t)&&!t.type&&left[t.id]>0.01&&dcap[t.id]>0.01&&t.due&&diff(t.due,t0)<=3).sort((a,c)=>sc[c.id]-sc[a.id]);
      if(!cand.length)break;

function missedList(){

const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
const icsDT=(date,m)=>{const d=dt(date);return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(Math.floor(m/60))+pad(m%60)+'00';};
function makeIcs(){

  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',t0=today();
  const ev=(date,m,dur,title,alarm)=>{L.push('BEGIN:VEVENT','UID:'+uid()+uid()+'@planner','DTSTAMP:'+stamp,'DTSTART:'+icsDT(date,m),'DTEND:'+icsDT(date,m+dur),'SUMMARY:'+icsEsc(title),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:'+(alarm||'PT0S'),'END:VALARM','END:VEVENT');};
  const rm=parseRemind(S.settings.remind);
  for(let i=0;i<14;i++){const d=addDays(t0,i),dow=dt(d).getDay();rm.forEach(r=>{if(r.days?r.days.includes(dow):(dow>=1&&dow<=5))ev(d,r.m,10,r.text);});}
  const ct=critTypes();
  S.tasks.filter(t=>isOpen(t)&&!isHome(t)&&t.due&&diff(t.due,t0)>=0&&diff(t.due,t0)<=30&&(ct.includes((t.type||'').toLowerCase())||(+t.imp)===3))

}

    {k:'lines',label:'По одной задаче в строке. Можно «Тип: название», например «Письмо: запрос РКД». Остальные попадут во «Входящие» для разбора.',type:'textarea',rows:12,val:''},
    {k:'kind',label:'Категория',type:'select',val:'work',opts:[['work','Работа'],['home','Дом']]}
  ],v=>{
    const known=allTypes();let n=0;
    v.lines.split('\n').map(x=>x.trim()).filter(Boolean).forEach(line=>{
      let type='Входящие',title=line;const m=line.match(/^([^:]{2,30}):\s*(.+)$/);
      const hit=m&&known.find(x=>x.toLowerCase()===m[1].trim().toLowerCase());
      if(hit){type=hit;title=m[2];}
      S.tasks.push({id:uid(),title,kind:v.kind,type:v.kind==='home'?'':type,project:'',start:'',due:'',imp:2,est:0.5,spent:0,perDay:0,status:'todo',resp:'',note:'',repeat:''});n++;

    save();render();toast('Добавлено: '+n);

}

function repeatDone(t){t.due=nextDue(t);t.status='todo';t.spent=0;delete t.pct;delete t.lrn;delete t.est0;t.hold=t.due;t.doneAt=today();}
function nextDue(t){
  if(t.dly){const o=t.due,m=t.mt0;dlyAdvance(t);const r=t.due;t.due=o;if(m)t.mt0=m;return r;}
  const t0=today();let d=t.due||t0;
  if(isDaily(t)){const b=d>t0?d:t0;return nextPat(t,addDays(b,1));}
  for(let i=0;i<400&&diff(d,t0)<=0;i++){const x=dt(d);if(t.repeat==='d')x.setDate(x.getDate()+1);else if(t.repeat==='w')x.setDate(x.getDate()+7);else x.setMonth(x.getMonth()+1);d=iso(x);}
  return d;
}

/* ---------- отрисовка ---------- */
function dayLevel(t){const t0=today(),d=t.due?diff(t.due,t0):99;
  if(t.hot)return 'hi';
  if(!(isOpen(t)&&isWork(t)&&!isHome(t))||t.repeat)return '';
  if(isCrit(t)&&d<=0)return 'hi';
  if(+t.imp>=3&&d<0)return 'hi';
  if(+t.imp>=3||d<0||(isCrit(t)&&d<=2)||riskOf(t).lvl>=3)return 'md';
  return '';}
function dayCard(t){
  const p=proj(t.project),t0=today(),lv=dayLevel(t);let when='';
  if(isOpen(t)&&t.due){const d=diff(t.due,t0);when=d<0?`<span class="r">просрочено на ${-d} дн.</span>`:d===0?'<b>срок сегодня</b>':'срок '+fmt(t.due);}
  const cm=t.cm||(isOpen(t)&&isWork(t)&&!isHome(t)&&typeof consOf==='function'?consOf(t):'')||'';
  const meta=[t.tm&&isOpen(t)?'<b>⏰ '+esc(t.tm)+(tmDay(t)&&tmDay(t)!==t0?' ('+fmt(tmDay(t)).slice(0,5)+')':'')+'</b>':'',when,isHome(t)?'🏠 дом':'',t.repeat?'🔁 '+REPEAT[t.repeat]:'',p?esc(p.name):'',t.est?(t.spent?'осталось '+rem(t)+' из '+t.est+' ч':t.est+' ч'):'',['wait','block'].includes(t.status)?'⏳ '+stName(t.status):'',blockedBy(t).length&&isOpen(t)?'⛓ ждёт «'+esc(blockedBy(t)[0].title.slice(0,24))+'»':''].filter(Boolean).join(' · ');
  return `<div class="dc ${lv} ${isClosed(t)?'done':''}"><input type="checkbox" data-act="toggle" data-id="${t.id}" ${isClosed(t)?'checked':''}>
  <div class="grow" data-act="edit" data-id="${t.id}"><div class="t">${esc(t.title)}</div>${cm?`<div class="cm">${esc(cm)}</div>`:''}<div class="mt">${meta}</div></div>
  ${isOpen(t)?`<div class="ac"><button data-act="tpost" data-id="${t.id}" title="Отложить">⏳ Отложить</button><button data-act="tmore" data-id="${t.id}" title="Ещё">⋯</button></div>`:''}</div>`;
}
function card(t){
  const p=proj(t.project),t0=today();let badge='';

    badge=d<0?`<span class="b red">просрочено ${-d} дн.</span>`:d===0?'<span class="b orange">сегодня</span>':`<span class="b">${fmt(t.due)} · ${d} дн.</span>`;}
  else if(t.due)badge=`<span class="b">${fmt(t.due)}</span>`;
  if(t.dueAuto)badge+='<span class="b orange" title="'+esc(t.dueAuto)+'">срок по правилу</span>';if(t.wait&&isOpen(t))badge+='<span class="b">⏳ жду данные</span>';
  if(['wait','block','review'].includes(t.status))badge+='<span class="b">'+(t.status==='wait'?'⏳ ':t.status==='block'?'⛔ ':'🔍 ')+stName(t.status)+'</span>';
  const bb=blockedBy(t);if(bb.length&&isOpen(t))badge+='<span class="b" title="Сначала: '+esc(bb.map(x=>x.title).join('; '))+'">⛓ ждёт «'+esc(bb[0].title.slice(0,24))+'»</span>';
  if(entOf(t)!=='task')badge+='<span class="b">'+(ENT.find(x=>x[0]===entOf(t))||[0,''])[1]+'</span>';
  if(isOpen(t)&&isWork(t)&&!isHome(t)){const rk=riskOf(t);if(rk.lvl===3)badge+='<span class="b red" title="'+esc(rk.text)+'">риск срыва</span>';else if(rk.lvl===2)badge+='<span class="b orange" title="'+esc(rk.text)+'">риск</span>';}
  const ja=ladj(t);if(ja>=8)badge+='<span class="b" title="Поднята по вашим привычкам">↑</span>';else if(ja<=-8)badge+='<span class="b" title="Опущена по вашим привычкам">↓</span>';

  <div class="s">${badge}${isHome(t)?'🏠 ':''}${t.type?'<span class="b">'+esc(t.type)+'</span>':''}${t.repeat?'🔁 '+REPEAT[t.repeat]+' · ':''}${p?esc(p.name)+' · ':''}${t.est?(t.spent?'осталось '+rem(t)+' из '+t.est+' ч':t.est+' ч')+' · ':''}${t.resp?esc(t.resp):''}</div></div>
  ${isOpen(t)&&isWork(t)&&!isHome(t)?`<button data-act="why" data-id="${t.id}" title="Почему здесь">ⓘ</button>`:''}${isHome(t)?'':`<button data-act="doc" data-id="${t.id}" title="Письмо / заявка по задаче">✉</button>`}</div>`;
}
function callRow(t){

}
function critRow(t){

function blockView(){

  if(miss.length)h+=`<div class="warn"><b>Не успели по плану:</b> ${miss.slice(0,5).map(m=>esc(m.t.title)+' ('+m.miss+' ч, блок '+hm(m.from)+')').join('; ')}${miss.length>5?' и ещё '+(miss.length-5):''}. Остаток уже перенесён в ближайшие блоки.</div>`;

  if(!live.length)h+='<div class="empty">Рабочий день закончился. План на завтра появится утром.</div>';

    r.items.forEach(x=>{h+=dayCard(x.t)+`<div class="lr">${hm(x.s)}–${hm(x.e)} · ${x.h} ч${x.part?' (часть, всего осталось '+rem(x.t)+' ч)':''} <button data-act="log" data-id="${x.t.id}" data-h="${x.h}">⏱ Сделал</button></div>`;});

  if(restOther.length)h+=`<details><summary>Не попали в блоки (${restOther.length}) — другой тип, без типа или не хватило времени</summary>${restOther.slice(0,15).map(dayCard).join('')}${restOther.length>15?`<div class="s">… и ещё ${restOther.length-15}</div>`:''}</details>`;
  h+=waitView();

const PH=/\{\{\s*([^{}]+?)\s*\}\}/g;
function phKeys(body){const k=[];let m;PH.lastIndex=0;while((m=PH.exec(body))){const n=m[1].trim();if(!k.some(x=>x.toLowerCase()===n.toLowerCase()))k.push(n);}return k;}
function defaults(){
  const d=ui.doc,p=proj(d.project),t=S.tasks.find(x=>x.id===d.task),s=S.settings;
  return {'дата':fmt(today()),'исходящий номер':(s.prefix||'')+s.nextNo,'организация':s.company,'адресат':p&&p.recipient,'должность адресата':p&&p.recipientPos,
  'объект':p&&p.name,'договор':p&&p.contract,'заказчик':p&&p.customer,'документ':t&&t.title,'срок':t&&t.due?fmt(t.due):'',
  'стадия':p&&p.stage,'подписант':s.signer,'должность подписанта':s.position,'телефон':s.phone,'срок подписания':'5'};
}
function val(k){const d=ui.doc;const kk=k.toLowerCase();if(d.vals[kk]!==undefined)return d.vals[kk];const v=defaults()[kk];return v==null?'':v;}
function fillText(){const tpl=S.templates.find(t=>t.id===ui.doc.tpl);if(!tpl)return '';return tpl.body.replace(PH,(m,k)=>{const v=val(k.trim());return v||'['+k.trim()+']';});}

function grParts(G){ // регламент: участвуют только выбранные отделы
  const P=new Set(G.parts);
  G.items.forEach(it=>{const f=it.f[0];const fo=f==='*'||P.has(f==='ОП, ОТ'?'ОП':f);const t=it.t[0];
    const to=t==='*'||P.has(t)||['ОВП','СМО','МТО (ПЗ)'].includes(t);it.inc=!!(fo&&to&&(it.rid==null||grRuleOk(G,GREGC[it.rid])));});}
function grExpandF(G,tok){if(tok==='*')return G.parts.map(x=>x==='ОП'?'ОП, ОТ':x);return [tok];}
function grMatrix(G){
  const cal=grCal(),M={},ex=[],all=[];
  const put=(k,d)=>{(M[k]=M[k]||[]);if(!M[k].includes(d))M[k].push(d);};
  G.items.forEach(it=>{if(!it.inc)return;const d=grD(G,+it.day,cal),u=+it.day;
    it.f.forEach(ft0=>grExpandF(G,ft0).forEach(ft=>{const row=grRow(G,ft,it);
      if(!row){ex.push({d,from:ft,to:it.t.join(', '),text:it.text,why:'отдел «'+ft+'» отсутствует в форме'});return;}
      it.t.forEach(tt=>{
        if(tt==='ВСЕМ'){if(row==='ГИП')all.push({d,text:it.text});else GR_ALL.forEach(c=>put(row+'|'+(c==='СТРО'?'СТРО'+grSub(it):c),u));return;}
        const tl=tt==='*'?GR_ALL.filter(c=>G.parts.includes(c)||c==='МТО').filter(c=>c!==ft&&c!==row):[tt];
        tl.forEach(t1=>{const col=grCol(G,t1);
          if(!col){ex.push({d,from:row,to:t1==='ГЛИНЖ'?'Главному инженеру':t1,text:it.text,why:t1==='ГЛИНЖ'?'нет колонки в форме':t1==='ПТ'?'колонка ПТ отключена':'нет колонки в форме'});return;}
          put(row+'|'+(col==='СТРО'?'СТРО'+(it.sub||grSub(it)):col),u);});});}));});
  Object.keys(M).forEach(k=>M[k].sort((a,b)=>a-b));ex.sort((a,b)=>a.d<b.d?-1:1);
  const rp=G.mode==='gtp'&&G.prio!=='gtp'?grOverlay(G,M):[];
  return {M,ex,all,cal,rep:rp};}
/* регламент поверх типового графика: состав заданий даёт ГТП, сроки (там, где правило есть) даёт регламент */
function grOverlay(G,M){
  const R=GREGC.filter(r=>grRuleOk(G,r)&&!(G.regOff||{})[r.ix]),keys=Object.keys(M),hits={};
  const colsOf=row=>keys.filter(k=>k.startsWith(row+'|')).map(k=>k.slice(row.length+1));
  const add=(row,col,r)=>{const k=row+'|'+col;(hits[k]=hits[k]||{k,row,col,rules:[]}).rules.push(r);};
  R.forEach(r=>{
    const rowTok=r.row||(r.f==='ОП, ОТ'?'ОП, ОТ':r.f);
    const rows=r.f==='*'?GR_ROWS.filter(x=>x!=='ГИП'&&x!=='ГП вер.пл.'):[rowTok];
    rows.forEach(row=>{
      if(r.t==='*'){colsOf(row).filter(c=>!['ОВП','СМО','МТО (ПЗ)','ПОС','ТЭО','ОП'].includes(c)&&row!==c).forEach(c=>add(row,c,r));return;}
      if(r.t==='СТРО'){if(colsOf(row).some(c=>/^СТРО\d$/.test(c)))add(row,'СТРО'+(r.sub||1),r);return;}
      if((M[row+'|'+r.t]||[]).length)add(row,r.t,r);});});
  const rp=[];
  Object.values(hits).forEach(h=>{const old=(M[h.k]||[]).slice(),days=[...new Set(h.rules.map(r=>r.day))].sort((a,b)=>a-b),fin=h.rules.some(r=>r.fin);
    const nw=fin?old.filter(x=>x<60&&!days.includes(x)).concat(days):days.concat(old.slice(days.length).filter(x=>x>days[days.length-1]));
    if(old.join()===nw.join())return;M[h.k]=nw;
    rp.push({k:h.k,row:h.row,col:h.col,old,nw,r:h.rules[0],ids:h.rules.map(r=>r.ix),text:[...new Set(h.rules.map(r=>r.text))].join('; '),added:!old.length});});
  return rp;}
function grCellLines(G,mx,k){const a=mx.M[k]||[];return a.map(u=>{const dm=grDM(grD(G,u,mx.cal));return G.show==='u'?String(u):G.show==='du'?dm+' ('+u+')':dm;});}
const grColList=G=>{const L=[];GR_COLS.forEach(c=>{if(c==='ПТ'&&!G.pt)return;if(c==='СТРО'){L.push({k:'СТРО1',l:'1',g:'СТРО'},{k:'СТРО2',l:'2',g:'СТРО'},{k:'СТРО3',l:'3',g:'СТРО'});}else L.push({k:c,l:c});});return L;};

const grFix2=s=>String(s||'');
function grName(G){return ('График '+(G.hdr.no||'')+' '+(G.hdr.cipher||'')).trim().replace(/[\\/:*?"<>|]/g,'')||'График';}
function grCsv(G){const cal=grCal();return csvText([['У.д.','Дата','От кого','Кому','Формы','Содержание']].concat(G.items.filter(i=>i.inc).map(i=>[i.day,fmt(grD(G,+i.day,cal)),i.f.join(', '),i.t.join(', '),i.forms,i.text])));}
function grMaxDay(G){return G.items.filter(i=>i.inc).reduce((m,i)=>Math.max(m,+i.day||0),0);}
/* срок завершения: условные дни сжимаются пропорционально, чтобы последнее задание пришлось на дату окончания (удлинять график не нужно) */
function grScale(G,c){const e=G.hdr.end,M=grMaxDay(G);if(!e||M<2||!G.hdr.start)return null;
  const key=[G.hdr.start,e,M,S.settings.grHol||'',S.settings.grWork||''].join('|');if(G._sc&&G._sc.key===key)return G._sc.v;
  let d=grDate(G.hdr.start,1,c),N=0;for(let i=0;i<800&&d<=e;i++){if(grIsW(d,c))N++;d=addDays(d,1);}
  const v=N>=M?null:{N,M,k:N>1?(N-1)/(M-1):0};Object.defineProperty(G,'_sc',{value:{key,v},writable:true,enumerable:false,configurable:true});return v;}
function grD(G,day,c){c=c||grCal();const sc=grScale(G,c);let u=+day;if(sc&&u>1)u=1+Math.round((u-1)*sc.k);return grDate(G.hdr.start,u,c);}

  else h+=' Срок завершения не короче расчётного: сжатие не требуется'+(diff(H.end,nat)>0?`, запас ${diff(H.end,nat)} дн.`:'')+'.';
  if(sc&&sc.N<2)h+=' <b style="color:var(--red)">Дата окончания слишком близка к началу.</b>';
  return h;}

function weekPlan(upto){
  const base=today(),days=[],snap=new Map(),had=new Set(Object.keys(S.log));let over=[];
  try{
    for(let k=0;k<=upto;k++){
      const d=addDays(base,k),wd=dt(d).getDay();
      if(wd===0||wd===6){days.push({d,off:true,items:[],meets:[],late:[],h:0});continue;}
      const day=withDay(d,()=>{
        const P=k===0?planBlocks({}):planBlocks({now:0,lost:0});
        const items=P.rows.flatMap(r=>r.items.map(x=>({t:x.t,h:x.h,s:x.s,e:x.e})));
        const placed={};items.forEach(x=>{placed[x.t.id]=(placed[x.t.id]||0)+x.h;});
        const meets=S.tasks.filter(t=>isOpen(t)&&entOf(t)==='meeting'&&t.mt&&(t.due===d||(t.dly&&dlyOn(t,d)&&diff(d,t.due)>0))).map(t=>({title:t.title,mt:t.due===d?t.mt:(t.mt0||t.mt)})).sort((x,y)=>x.mt.localeCompare(y.mt));
        const late=P.rest.filter(t=>t.due&&diff(t.due,d)<=0).map(t=>({t,left:Math.max(0,Math.round((rem(t)-(placed[t.id]||0))*100)/100)}));
        const g=[];items.forEach(x=>{let q=g.find(y=>y.t===x.t);if(!q)g.push(q={t:x.t,h:0,s:x.s,e:x.e,n:0});q.h=Math.round((q.h+x.h)*100)/100;q.e=x.e;q.n++;});
        return {d,items,g,meets,late,h:items.reduce((a,x)=>a+x.h,0)};
      });
      days.push(day);
      day.items.forEach(x=>{if(!snap.has(x.t.id))snap.set(x.t.id,{has:'spent' in x.t,v:x.t.spent});x.t.spent=(+x.t.spent||0)+x.h;});
    }
    const last=addDays(base,upto);
    over=withDay(last,()=>S.tasks.filter(t=>isOpen(t)&&isWork(t)&&!isHome(t)&&entOf(t)==='task'&&!unavail(t)&&t.due&&diff(t.due,last)<=0&&rem(t)>0.01).map(t=>({t,left:rem(t)})));

    Object.keys(S.log).forEach(k=>{if(!had.has(k))delete S.log[k];});RM=null;
  }
  return {days,over};}

function aiBalance(x){
  let st=[],inS=false,esc=false;
  for(const ch of x){if(inS){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='"')inS=false;}else if(ch==='"')inS=true;else if(ch==='{'||ch==='[')st.push(ch==='{'?'}':']');else if(ch==='}'||ch===']')st.pop();}
  let o=x;if(inS)o+='"';o=o.replace(/[,:\s]+$/,'');if(/"\s*$/.test(o)&&st[st.length-1]==='}'&&/[{,]\s*"[^"]*"$/.test(o))o+=':null';
  return o+st.reverse().join('');}
function aiParse(cont){
  const t0=String(cont).replace(/```json|```/g,''),i=t0.indexOf('{');
  if(i<0)throw new Error('Модель не вернула ответ в нужном формате');
  const t=t0.slice(i),cut=t.slice(0,t.lastIndexOf('}')+1)||t;
  const fix=x=>x.replace(/,\s*([}\]])/g,'$1').replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g,'$1"$2":').replace(/'([^'\n]*)'\s*:/g,'"$1":').replace(/:\s*'([^'\n]*)'/g,':"$1"').replace(/\bNone\b/g,'null').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false');
  const tries=[cut,fix(cut),aiBalance(fix(t)),fix(cut).replace(/[“”]/g,'"'),aiBalance(fix(t).replace(/[“”]/g,'"'))];
  for(const x of tries){try{const o=JSON.parse(x);if(o&&typeof o==='object'&&!Array.isArray(o))return o;}catch(e){}}
  throw new Error('Ответ модели не удалось разобрать');}
const aiSmall=()=>/0\.5B|1\.5B|[^.\d]1B/i.test(S.settings.aiBModel||BMODELS[1][0]);
async function builtinGen(sys,msgs,json,maxTok){
  const req={messages:[{role:'system',content:sys+(json?' Отвечай одним JSON-объектом, без пояснений до и после него.':'')}].concat(msgs.map(m=>({role:m.role,content:String(m.content).slice(0,6000)}))),temperature:0.2,max_tokens:maxTok||700};
  let r=null,last=null;
  for(let attempt=0;attempt<2&&!r;attempt++){
    const eng=await builtinLoad();
    try{try{await eng.resetChat();}catch(e){}r=await eng.chat.completions.create(req);}
    catch(e){last=e;const m=String(e&&e.message||e);
      if(attempt===0&&/dispos|device|lost|GPU|abort/i.test(m)){try{await eng.unload();}catch(x){}WL.eng=null;WL.id='';aiStatus('Перезапускаю модель…');continue;}
      throw new Error('Модель загружена, но сбой при ответе: '+m+(/dispos|device|lost|GPU|memory|Out of/i.test(m)?'. Закройте другие вкладки и приложения (не хватает памяти видеокарты) или выберите размер 0,5 млрд':''));}}
  if(!r)throw new Error('Модель не ответила: '+(last&&last.message||'сбой'));
  return (r.choices&&r.choices[0]&&r.choices[0].message&&r.choices[0].message.content)||'';}
async function aiCall(sys,msgs){
  const mode=aiMode();

  if(mode==='builtin')return aiParse(await builtinGen(sys,msgs,true));
  const c=S.settings;if(c.aiAllow!=='да'||!c.aiUrl)throw new Error('Передача текста на сервер модели отключена в настройках');
  let host='';try{host=new URL(c.aiUrl).hostname;}catch(e){throw new Error('Неверный адрес модели');}
  if(!aiLocal(host)&&!AIS.ok[host]){if(!confirm('Текст будет отправлен на внешний сервер '+host+'. Продолжить? (подтверждение действует до закрытия приложения)'))throw new Error('Отправка отменена');AIS.ok[host]=1;}
  const go=async rf=>{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),180000);
    try{return await fetch(c.aiUrl,{method:'POST',signal:ac.signal,headers:Object.assign({'Content-Type':'application/json'},c.aiKey?{Authorization:'Bearer '+c.aiKey}:{}),body:JSON.stringify(Object.assign({model:c.aiModel||'llama3',temperature:0.2,messages:[{role:'system',content:sys}].concat(msgs)},rf?{response_format:{type:'json_object'}}:{}))});}
    finally{clearTimeout(tm);}};

function aiToQuick(a,base){
  const q=Object.assign({imp:2,ent:'task'},base||{});

  if(a.due&&/^\d{4}-\d{2}-\d{2}$/.test(a.due))q.due=a.due;
  if(+a.hours>0&&+a.hours<=80)q.est=+a.hours;
  if(a.needs)q.needsData=String(a.needs).slice(0,120);
  if(a.type){const ty=allTypes().find(x=>x.toLowerCase()===String(a.type).toLowerCase());if(ty)q.type=ty;}
  if(a.project){const k=String(a.project).toLowerCase(),p=S.projects.find(x=>x.name.toLowerCase().includes(k)||k.includes(x.name.toLowerCase()));if(p)q.project=p.id;}
  if(a.urgent){q.urgent=1;q.imp=3;}if(a.section)q.section=String(a.section).slice(0,40);q.ai=1;return q;}

  else if(a==='qai'){const text=($('#qqtext')||{}).value||'';if(!text.trim())return;toast('Разбираю текст моделью…');aiExtract(text,parseQuick(text)).then(q=>{if(q.aiFail)toast('Модель не справилась, разобрал правилами. Проверьте поля.');quickAdd(text,q);}).catch(e=>{toast(e.message);});}
  else if(a==='loff'){S.learn.off=S.learn.off||{};const k=b.dataset.k;if(S.learn.off[k])delete S.learn.off[k];else S.learn.off[k]=1;Object.keys(LC).forEach(x=>delete LC[x]);Object.keys(PC).forEach(x=>delete PC[x]);RM=null;save();render();}
  else if(a==='ldel'){delete S.settings.lead[b.dataset.k];save();render();}
  else if(a==='aitest'){aiExtract('Проверка связи: подготовить письмо до пятницы, два часа',parseQuick('Проверка связи: подготовить письмо до пятницы, два часа')).then(q=>toast('Модель отвечает: «'+q.title.slice(0,40)+'»'+(q.due?', срок '+fmt(q.due):''))).catch(e=>toast(e.message));}
  else if(a==='csvtasks'){const pn=id=>{const p=proj(id);return p?p.name:'';},tn=id=>{const x=S.tasks.find(y=>y.id===id);return x?x.title:'';};
    download(new Blob([csvText([['Объект','Вид','Название','Тип','Раздел','Статус','Начало','Срок','Срок по плану','Оценка, ч','Потрачено, ч','Готовность, %','Важность','Ответственный','Исходные данные','Зависит от','Источник','Переносов']].concat(S.tasks.map(t=>[pn(t.project),(ENT.find(x=>x[0]===entOf(t))||[0,''])[1],t.title,t.type,t.section||'',stName(t.status),t.start,t.due,t.dueAuto?t.due0:t.due,t.est,t.spent||0,t.pct!=null?t.pct:(t.est>0?Math.min(99,Math.round((t.spent||0)/t.est*100)):''),t.imp,t.resp,t.needsData||'',(t.deps||[]).map(tn).join('; '),t.src||'',t.mv||0])))],{type:'text/csv'}),'planner-tasks-'+today()+'.csv');}
  else if(a==='csvrep'){const t0=today(),H=+S.settings.hours||7;const rows=[['Отчёт о загрузке и рисках на '+fmt(t0)],[],['Загрузка по объектам'],['Объект','Открытых задач','Осталось, ч','Со сроком в 14 дней, ч','Просрочено, шт.']];
    S.projects.concat([{id:'',name:'(без объекта)'}]).forEach(p=>{const l=S.tasks.filter(t=>isOpen(t)&&isWork(t)&&!isHome(t)&&t.project===p.id);if(!l.length)return;rows.push([p.name,l.length,l.reduce((x,t)=>x+rem(t),0).toFixed(1),l.filter(t=>t.due&&diff(t.due,t0)<=14).reduce((x,t)=>x+rem(t),0).toFixed(1),l.filter(t=>t.due&&diff(t.due,t0)<0).length]);});
    rows.push([],['Доступно рабочих часов в день',H,'резерв, %',Math.round(reserveFrac()*100)],[],['Риски'],['Уровень','Риск','Описание']);
    risksList().forEach(r=>rows.push([r.lvl>=3?'высокий':'средний',r.title,r.text]));
    download(new Blob([csvText(rows)],{type:'text/csv'}),'planner-report-'+t0+'.csv');}
  else if(a==='csvjl'){download(new Blob([csvText([['Дата','Задача','Изменение']].concat(S.jl.map(x=>[new Date(x.ts).toLocaleString('ru-RU'),x.tt,x.c])))],{type:'text/csv'}),'planner-journal-'+today()+'.csv');}
  else if(a==='sgn'){S.learn.dis[b.dataset.id]=Date.now();rec('sug',0);save();render();}
  else if(a==='sgx'){S.learn.dis[b.dataset.id]=Date.now()+46*864e5;rec('sug',-1);save();render();}
  else if(a==='sgy'){const id=b.dataset.id;let m;S.learn.dis[id]=Date.now();rec('sug',1);
    if(m=id.match(/^(up|dn):(.*)$/)){const d=m[1]==='up'?1:-1;let n=0;S.tasks.forEach(t=>{if(isOpen(t)&&lt(t)===m[2]){const v=Math.max(1,Math.min(3,(+t.imp||2)+d));if(v!==(+t.imp||2)){t.imp=v;n++;}}});toast('Важность изменена у '+n+' задач');}
    else if(m=id.match(/^lead:(\d+):(.*)$/)){S.settings.lead=Object.assign({},S.settings.lead,{[m[2]]:+m[1]});toast('Срок «'+m[2]+'» теперь считается раньше на '+m[1]+' дн.');}
    else if(id==='otoff'){S.settings.otWeek=0;toast('Рекомендации остаться после работы отключены');}
    else if(id==='stale'){ui.fs='stale';ui.fk='';ui.fp='';tab='plan';}
    save();render();window.scrollTo(0,0);}
  else if(a==='lreset'){if(confirm('Удалить накопленный опыт? Задачи останутся.')){S.learn={samples:[],ev:[],hits:[],dis:{}};S.settings.lead={};lfit();pfit();save();render();}}
  else if(a==='wipe'){if(confirm('Удалить все задачи, объекты и шаблоны с этого устройства?')&&confirm('Точно удалить? Действие необратимо.')){localStorage.removeItem(KEY);location.reload();}}
  else if(a==='impcancel'){imp=null;dlg.onchange=null;dlg.close();}
  else if(a==='impgo')runImport();
  else if(a==='calgo')runCalImport();
  else if(a==='calodset'){dlg.querySelectorAll('[data-od]').forEach(x=>{x.value=b.dataset.v;});}
  else if(a==='calodgo'){dlg.querySelectorAll('[data-od]').forEach(x=>{imp.cal[+x.dataset.od].od=x.value;});runCalImport();}
  else if(a==='calodback'){imp.cal.forEach(x=>{delete x.od;});renderCalImport();}
  else if(a==='calplain'){imp.cal=null;renderImport();}
});
document.addEventListener('change',e=>{
  const el=e.target,a=el.dataset&&el.dataset.act;if(!a)return;
  if(a==='iqoff'){S.settings.iqoff=!el.checked;save();render();return;}
  if(a==='homen'){S.settings.homeOff=!el.checked;save();render();return;}
  if(a==='shopdone'){const i=S.shop.find(x=>x.id===el.dataset.id);if(i){i.done=el.checked;i.doneAt=el.checked?Date.now():0;save();render();}return;}
  if(a==='toggle'){const t=S.tasks.find(x=>x.id===el.dataset.id);
    const hq=+t.spent||+t.est||.5,wasDue=t.due,late=el.checked&&t.repeat&&wasDue&&wasDue<today();
    if(el.checked&&t.repeat){repeatDone(t);save();render();toast('Повторяющаяся задача: следующий раз '+fmt(t.due));if(late)odAsk(t,wasDue,hq);else iqAsk(t,hq);return;}
    if(el.checked)pev(t);t.status=el.checked?'done':'todo';t.doneAt=el.checked?today():'';if(el.checked)lrec(t);save();render();if(el.checked)iqAsk(t,hq);
    if(el.checked&&(t.type||'').toLowerCase()==='акт'&&confirm('Задача выполнена. Сформировать заявку на подписание акта?')){const tpl=S.templates.find(x=>x.id==='act');ui.doc={tpl:tpl?tpl.id:ui.doc.tpl,project:t.project,task:t.id,vals:{}};tab='docs';render();}}
  else if(a==='wtxt'){const m={срочность:'urg',важность:'imp',последствия:'cons',влияние:'infl'},w={};el.value.split('\n').forEach(l=>{const p=l.split('|').map(x=>x.trim());if(m[p[0].toLowerCase()]&&p[1]!==''&&!isNaN(+p[1]))w[m[p[0].toLowerCase()]]=Math.max(0,Math.min(5,+p[1]));});S.settings.w=w;save();render();toast('Веса сохранены');}
  else if(a==='icsin'){const f=el.files[0];if(f)f.text().then(importIcs);el.value='';}
  else if(a==='kbtxt'){kbParse(el.value);save();render();toast('Правила сохранены');}
  else if(a==='fp'){ui.fp=el.value;render();}
  else if(a==='fk'){ui.fk=el.value;render();}
  else if(a==='fs'){ui.fs=el.value;render();}
  else if(a==='xlsx'){if(el.files[0])startImport(el.files[0]);el.value='';}
  else if(a==='ptender'){const pr=proj(el.dataset.id);if(pr){pr.tender=el.checked;save();render();}}
  else if(a==='syauto'){SY.auto=el.checked;sySave();if(SY.auto)syRun(false);}
  else if(a==='pplan'){if(el.files[0])startImport(el.files[0],el.dataset.id);el.value='';}
  else if(a==='jsonin'){const f=el.files[0];if(!f)return;f.text().then(x=>{let d;try{d=JSON.parse(x);if(!d.tasks||!d.settings)throw 0;}catch(_){toast('Это не файл копии планнера');return;}
    const r=mergeData(d);render();toast('Объединено: добавлено '+r.add+', обновлено '+r.upd+', удалено '+r.del);});el.value='';}
  else if(a==='jsonrep'){const f=el.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!d.tasks||!d.settings)throw 0;if(confirm('Заменить ВСЕ текущие данные загруженной копией?')){S=d;S.del={};SNAP={};save();location.reload();}}catch(_){toast('Это не файл копии планнера');}});el.value='';}
  else if(a==='dtpl'){ui.doc.tpl=el.value;ui.doc.vals={};render();}
  else if(a==='dproj'){ui.doc.project=el.value;ui.doc.task='';ui.doc.vals={};render();}
  else if(a==='dtask'){ui.doc.task=el.value;const t=S.tasks.find(x=>x.id===el.value);if(t&&t.project)ui.doc.project=t.project;ui.doc.vals={};render();}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='shopf'){e.preventDefault();const tx=String(new FormData(e.target).get('text')||'').trim();if(tx){const a=shopAdd(tx);toast(a.n?'Добавлено: '+a.items.join(', '):'Уже в списке');const el=$('#shoptx');if(el)el.focus();}return;}
  if(e.target.id==='qq'){e.preventDefault();const tx=String(new FormData(e.target).get('text')||'').trim();if(tx)quickAdd(tx);return;}
  if(e.target.id!=='qa')return;
  e.preventDefault();
  const f=new FormData(e.target),title=String(f.get('title')||'').trim();if(!title)return;
  S.tasks.push({id:uid(),title,kind:'home',type:'',project:'',start:'',due:String(f.get('due')||''),imp:2,est:0.5,status:'todo',resp:'',note:'',repeat:String(f.get('repeat')||'')});
  save();render();toast('Бытовая задача добавлена');
  const i=document.querySelector('#qa input[name=title]');if(i)i.focus();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f!==undefined){ui.doc.vals[el.dataset.f]=el.value;const p=$('#prev');if(p)p.textContent=fillText();}
  else if(el.dataset.s){S.settings[el.dataset.s]=el.type==='number'?(+el.value||0):el.value;save();}
});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').then(r=>{swReg=r;}).catch(()=>{});
let sig='';
document.addEventListener('change',e=>{const el=e.target;if(!el||el.type!=='date'||el.name!=='due'||!el.closest||!el.closest('dialog'))return;const k=el.closest('dialog').querySelector('[name=kind]');if(k&&k.value==='home')return;if(el.value&&isWkEnd(el.value)){el.value=wdSnap(el.value);toast('Только рабочие дни: выбрано '+fmt(el.value));}},true);
function softRender(){
  const P=planBlocks(),g=P.rows.map(r=>(r.cur?'c':'')+(r.past?'p':'-')).join('')+(offHours()?'o':'');
  if(g!==sig){sig=g;const ae=document.activeElement;if(tab==='today'&&!dlg.open&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();}
}
tick();
applyKB();setInterval(()=>{tick();softRender();},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();softRender();try{syRun(false);}catch(e){}try{lnSoon();}catch(e){}}else{try{clearTimeout(SYT);syRun(false);}catch(e){}}});
window.addEventListener('pagehide',()=>{try{clearTimeout(SYT);syRun(false);}catch(e){}});
window.addEventListener('online',()=>{try{syRun(false);}catch(e){}});
window.addEventListener('focus',()=>{try{syRun(false);}catch(e){}});
setTimeout(()=>{try{syRun(false);}catch(e){}},2500);setTimeout(()=>{try{lnPerm(false).then(()=>lnSync());}catch(e){}},3000);setInterval(()=>{try{if(!document.hidden)syRun(false);}catch(e){}},60000);setInterval(()=>{try{syStat();}catch(e){}},30000);
if(STAGE>=3){$('#tabs').innerHTML=[['today','📅','Сегодня'],['week','🗓','Неделя'],['proj','🏗','Проекты'],['risk','⚠','Риски'],['stat','📊','Статистика'],['buy','🛒','Покупки'],['plan','🗂','План'],['docs','✉','Документы'],['setup','⚙','Настройки']].map(x=>`<button data-tab="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('');}
render();window.__cpr=1;
if(STAGE>=3){lockNow();document.addEventListener('visibilitychange',()=>{if(document.hidden)hidAt=Date.now();else if(S.settings.pinh&&hidAt&&Date.now()-hidAt>120000)lockNow();});}
</script>
